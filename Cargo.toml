[package]
name = "pimc"
version = "0.2.0-beta.0"
edition = "2024"
authors = ["g-spada <gabcloud@pm.me>"]
description = "Scientific computing library for Path Integral Monte Carlo (PIMC) simulations."
repository = "https://github.com/g-spada/pimc"
license = "MIT"

[dependencies]
log = "0.4.27"
ndarray = { version = "0.16.1", features = ["serde"] }
paste = "1.0.15"
rand = "0.9.0"
rand_distr = "0.5.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
env_logger = "0.11.8"
rand_pcg = "0.9.0"
tempfile = "3.19.1"

[lib]
path="src/lib.rs"
